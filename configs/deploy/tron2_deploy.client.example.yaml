# Client-side deployment profile template.
# Copy this file to configs/deploy/<task>_client.local.yaml for private
# deployment, or to configs/deploy/<task>_client.yaml when publishing a
# reviewed public task example.
#
# Network deployment boundary:
# - Policy, robot-control, and Bridge interfaces are supported only for
#   authorized systems on a controlled robot LAN.
# - Do not expose them to the Internet or use them on an untrusted or shared network.
# - Some runtime links may not provide application authentication or TLS.
# - Any Internet-facing, cross-site, or cloud topology requires a separate
#   security review before use.
# - Source disclosure is not a functional safety approval or real-robot certification.

client:
  # Human-readable task name used for record filenames.
  task: TASK_NAME

  # Policy server address from the client process.
  policy_host: 127.0.0.1
  policy_port: 8000

  # Observation source:
  # bridge: get images and state from TRON2 Bridge WebSocket.
  # legacy: get images from directly attached RealSense cameras and robot state
  # from the robot WebSocket.
  observation_source: bridge

  # Default compatibility layout: ServoJ arms and grippers. If any hardware
  # module section below is enabled, state_dim/state_layout must exactly match
  # the derived physical layout and the trained policy state/action dimensions.
  state_dim: 16
  state_layout:
    - left_arm
    - left_gripper
    - right_arm
    - right_gripper

  # Policy action playback rate. publish_rate is the background ServoJ rate.
  fps: 30.0
  publish_rate: 300.0

  # Maximum accepted age in seconds for modular robot state.
  state_max_age: 0.5

  # Non-RTC client: number of policy chunks to run. Use null for unlimited.
  max_steps: null

  # Set true when running examples/tron2/pi_client_rtc.py.
  rtc_enabled: false

  # RTC run duration in seconds. Set 0 for unlimited until Ctrl+C.
  duration: 120.0

  # RTC timing in paper terms. H is read from server metadata/action_horizon.
  # execution_horizon is s; delay is the initial d in action frames.
  execution_horizon: 10
  delay: 2

  # Inference-time RTC guidance. When trained_rtc_mode is true, the model uses
  # training-time RTC conditioning and guidance can usually stay disabled.
  rtc_guidance_enabled: true
  rtc_guidance_weight: 10.0
  trained_rtc_mode: false

  # Recover from short bridge/observation gaps without reusing stale observations.
  obs_timeout_budget_s: 5.0
  obs_recovery_blend_frames: 6

  # Optional client-side smoothing of executable actions after queue replacement.
  rtc_action_postprocess:
    enabled: false
    boundary_blend_frames: 0
    boundary_blend_curve: smoothstep
    boundary_blend_scope: arm
    ema_alpha: 1.0
    ema_frames: 0
    ema_scope: arm

  log_level: INFO

  # Optional CSV logging for commanded actions and observed states.
  save_record: false
  action_output_path: debug_images/tron2_action_data.csv
  state_output_path: debug_images/tron2_state_data.csv
  rtc_action_output_path: debug_images/tron2_rtc_action_data.csv
  rtc_state_output_path: debug_images/tron2_rtc_state_data.csv

  # Used only when observation_source is "legacy".
  legacy_use_time_sync: true

  # Optional per-client prompt. Leave null to use policy.default_prompt.
  prompt: null

robot:
  # Robot WebSocket controller address.
  ip: ROBOT_IP
  port: 5000

  # Arm initialization pose, 14 values: left arm 7 + right arm 7.
  init_joints:
    - 0.026899
    - 0.2612
    - -0.02709991
    - -1.5477003
    - 0.265
    - 0.0180999
    - -0.0614999
    - 0.008999
    - -0.269
    - 0.02069998
    - -1.5567001
    - -0.254
    - -0.02309972
    - 0.06469989

  # Optional head initialization pose [pitch, yaw].
  init_head: null

  # Feedback polling settings for the robot WebSocket transport.
  state_queue_maxlen: 7
  polling_rate: 200.0
  connection_timeout: 5.0

# Hardware module examples. Leave all four sections commented to preserve the
# default ServoJ + gripper behavior. Supplying any section opts into explicit
# RobotModules and derives the physical state/action layout.
#
# ServoJ and ServoP are mutually exclusive. ServoP represents each arm as
# [x, y, z, qw, qx, qy, qz]; quaternion values must not be linearly blended.
# arm:
#   mode: servop  # servoj | servop

# Both arms use the same end-effector type. BrainCo2 command_time accepts one
# scalar or six values, one per hand joint.
# end_effector:
#   type: brainco2  # gripper | brainco2
#   command_time: 2.0
#   polling_rate: 20.0
#   state_timeout: 0.5

# head.enabled controls policy I/O; robot.init_head independently controls the
# optional initialization move.
# head:
#   enabled: true
#   command_interval: null
#   move_duration: null
#   ack_timeout: 1.0

# The mobile base adds [chassis_linear_x, chassis_angular_z, lifter_state].
# Lifter commands are absolute millimetres, so enabling control requires
# lifter_state_source: position_mm. raw_q is observation-only.
# mobile_base:
#   enabled: true
#   auxiliary_polling_rate: 20.0
#   lifter_state_source: position_mm  # raw_q | position_mm
#   lifter_control_enabled: true
#   lifter_command_interval: 0.1
#   lifter_stream_velocity_mm_s: 80.0

# ServoP and BrainCo2 require bridge.state_source: legacy when images still
# come from Bridge. The public package supports only the WebSocket backend.

bridge:
  # Required when client.observation_source is "bridge".
  host: wss://BRIDGE_HOST
  ws_path: /bridge/ws

  # "bridge" uses bridge-aligned joint state. "legacy" uses robot WebSocket
  # state while still taking images from the bridge.
  state_source: bridge

  image_max_fps: 0
  align_max_delay_ms: 200
  verify_tls: false
  save_debug_images: false
  debug_image_dir: debug_images

camera:
  # Required when client.observation_source is "legacy".
  # Replace these placeholders with actual RealSense serial numbers.
  serial_to_name:
    HEAD_CAMERA_SERIAL: cam_high
    LEFT_WRIST_CAMERA_SERIAL: cam_left_wrist
    RIGHT_WRIST_CAMERA_SERIAL: cam_right_wrist

  camera_names:
    - cam_high
    - cam_left_wrist
    - cam_right_wrist

  # RealSense color stream resolution is [height, width, channels].
  resolution: [480, 640, 3]
  fps: 30
  max_queue_size: 10
  save_debug_images: false
  debug_image_dir: debug_images
