# 客户端部署 profile 模板。
# 私有部署时复制到 configs/deploy/<任务名>_client.local.yaml；经过开源审核后
# 作为公开任务示例发布时，可复制到 configs/deploy/<任务名>_client.yaml。
#
# 网络部署边界：
# - 当前 policy、机器人控制和 Bridge 接口仅支持授权系统接入的受控机器人局域网。
# - 不得暴露到互联网，也不得在不受信任或共享网络中使用。
# - 当前传输并非都提供应用层鉴权或 TLS。
# - 任何面向互联网、跨站点或云端的拓扑都必须在使用前单独进行安全评审。
# - 源码公开不等于功能安全批准或真机认证。

client:
  # 任务名，用于生成录制文件名。
  task: TASK_NAME

  # client 连接 policy server 的地址。
  policy_host: 127.0.0.1
  policy_port: 8000

  # 观测来源：
  # bridge：从 TRON2 Bridge WebSocket 获取图像和状态。
  # legacy：直接使用本机 RealSense 相机，机器人状态从机器人 WebSocket 获取。
  observation_source: bridge

  # 默认兼容布局：双臂 ServoJ 和双夹爪。启用下方任一硬件模块后，
  # state_dim/state_layout 必须与推导出的物理布局以及模型训练维度完全一致。
  state_dim: 16
  state_layout:
    - left_arm
    - left_gripper
    - right_arm
    - right_gripper

  # policy 动作执行频率。publish_rate 是后台 ServoJ 指令发送频率。
  fps: 30.0
  publish_rate: 300.0

  # 模块化机器人状态允许的最大数据年龄，单位秒。
  state_max_age: 0.5

  # 普通非 RTC client 运行多少个 policy action chunk，null 表示持续运行直到手动停止。
  max_steps: null

  # 运行 examples/tron2/pi_client_rtc.py 时设置为 true。
  rtc_enabled: false

  # RTC 运行时长，单位秒。设置为 0 表示一直运行直到 Ctrl+C。
  duration: 120.0

  # RTC 时序参数。H 会从 server metadata/action_horizon 读取。
  # execution_horizon 是论文里的 s，delay 是初始 d，单位为 action frame。
  execution_horizon: 10
  delay: 2

  # 推理时 RTC guidance。若模型使用 trained_rtc_mode，通常可以将 guidance 关闭。
  rtc_guidance_enabled: true
  rtc_guidance_weight: 10.0
  trained_rtc_mode: false

  # 短暂观测中断时等待新鲜观测，不复用旧 obs。
  obs_timeout_budget_s: 5.0
  obs_recovery_blend_frames: 6

  # 可选的 client 侧动作平滑，用于 queue replacement 后的可执行动作。
  rtc_action_postprocess:
    enabled: false
    boundary_blend_frames: 0
    boundary_blend_curve: smoothstep
    boundary_blend_scope: arm
    ema_alpha: 1.0
    ema_frames: 0
    ema_scope: arm

  log_level: INFO

  # 是否保存执行过程中的 action/state CSV 日志。
  save_record: false
  action_output_path: debug_images/tron2_action_data.csv
  state_output_path: debug_images/tron2_state_data.csv
  rtc_action_output_path: debug_images/tron2_rtc_action_data.csv
  rtc_state_output_path: debug_images/tron2_rtc_state_data.csv

  # 仅 observation_source 为 legacy 时使用。
  legacy_use_time_sync: true

  # client 侧任务指令。null 表示使用 policy.default_prompt。
  prompt: null

robot:
  # 机器人 WebSocket 控制器地址。
  ip: ROBOT_IP
  port: 5000

  # 机器人初始化双臂关节位置，共 14 个值：左臂 7 个 + 右臂 7 个。
  init_joints:
    - 0.026899
    - 0.2612
    - -0.02709991
    - -1.5477003
    - 0.265
    - 0.0180999
    - -0.0614999
    - 0.008999
    - -0.269
    - 0.02069998
    - -1.5567001
    - -0.254
    - -0.02309972
    - 0.06469989

  # 可选头部初始化位置 [pitch, yaw]。
  init_head: null

  # 机器人状态反馈队列和轮询参数。
  state_queue_maxlen: 7
  polling_rate: 200.0
  connection_timeout: 5.0

# 硬件模块示例。保持下面四个部分为注释时，继续使用默认 ServoJ + 夹爪行为；
# 配置任一模块后会启用显式 RobotModules，并据此推导物理 state/action 布局。
#
# ServoJ 与 ServoP 互斥。ServoP 每条手臂使用
# [x, y, z, qw, qx, qy, qz]，四元数不能做线性混合。
# arm:
#   mode: servop  # servoj | servop

# 双臂必须使用同一种末端执行器。BrainCo2 的 command_time 可以是一个标量，
# 也可以是分别对应六个手指关节的六个值。
# end_effector:
#   type: brainco2  # gripper | brainco2
#   command_time: 2.0
#   polling_rate: 20.0
#   state_timeout: 0.5

# head.enabled 控制模型输入输出；robot.init_head 独立控制可选的初始化动作。
# head:
#   enabled: true
#   command_interval: null
#   move_duration: null
#   ack_timeout: 1.0

# 底盘模块增加 [chassis_linear_x, chassis_angular_z, lifter_state]。
# 升降台控制使用绝对毫米值，因此启用控制时必须使用 position_mm；
# raw_q 只能用于观测。
# mobile_base:
#   enabled: true
#   auxiliary_polling_rate: 20.0
#   lifter_state_source: position_mm  # raw_q | position_mm
#   lifter_control_enabled: true
#   lifter_command_interval: 0.1
#   lifter_stream_velocity_mm_s: 80.0

# 图像来自 Bridge 时，ServoP 和 BrainCo2 要求 bridge.state_source: legacy。
# 开源包仅支持 WebSocket 控制后端。

bridge:
  # client.observation_source 为 bridge 时需要配置。
  host: wss://BRIDGE_HOST
  ws_path: /bridge/ws

  # bridge：使用 Bridge 对齐后的机器人状态。
  # legacy：图像仍来自 Bridge，但机器人状态来自机器人 WebSocket。
  state_source: bridge

  image_max_fps: 0
  align_max_delay_ms: 200
  verify_tls: false
  save_debug_images: false
  debug_image_dir: debug_images

camera:
  # client.observation_source 为 legacy 时需要配置。
  # 将占位符替换为你实际使用的 RealSense 相机序列号。
  serial_to_name:
    HEAD_CAMERA_SERIAL: cam_high
    LEFT_WRIST_CAMERA_SERIAL: cam_left_wrist
    RIGHT_WRIST_CAMERA_SERIAL: cam_right_wrist

  camera_names:
    - cam_high
    - cam_left_wrist
    - cam_right_wrist

  # RealSense 彩色图像分辨率，格式为 [高度, 宽度, 通道数]。
  resolution: [480, 640, 3]
  fps: 30
  max_queue_size: 10
  save_debug_images: false
  debug_image_dir: debug_images
