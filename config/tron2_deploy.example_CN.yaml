# 网络部署边界：
# - 当前 policy、机器人控制和 Bridge 接口仅支持授权系统接入的受控机器人局域网。
# - 不得暴露到互联网，也不得在不受信任或共享网络中使用。
# - 当前传输并非都提供应用层鉴权或 TLS。
# - 任何面向互联网、跨站点或云端的拓扑都必须在使用前单独进行安全评审。
# - 源码公开不等于功能安全批准或真机认证。
# 这些注释仅说明边界，不改变下方任何运行默认值。

policy:
  # 训练配置名称，需要和 src/openpi/training/config.py 中注册的 config 名称一致。
  config: TASK_CONFIG_NAME

  # 数据集或仓库 ID，主要用于加载 checkpoint 对应的 assets，例如归一化统计量。
  repo_id: DATASET_REPO_ID

  # 训练好的 checkpoint step 目录。
  # 可以写绝对路径，也可以写相对于 tron2_openpi 项目根目录的路径。
  checkpoint_dir: /path/to/checkpoints/TASK_CONFIG_NAME/experiment/step

  # 默认任务指令。client 没有通过 --prompt 指定任务时，会使用这里的文本。
  default_prompt: TASK_PROMPT

  # 是否保存 policy 的原始输入和输出，通常只在调试时打开。
  record: false

  # 可选的推理覆盖项。保持 null/默认值时使用训练 config 中的设置。
  action_horizon: 50
  state_dim: 16
  use_delta_joint_actions: false

server:
  # policy server 监听地址。
  # 0.0.0.0 表示允许同一台机器或同一网络中的 client 连接。
  host: 0.0.0.0
  port: 8000

  # JAX 持久编译缓存由环境变量 OPENPI_JAX_CACHE_DIR 控制。
  # 默认路径为 /tmp/openpi_jax_cache。

client:
  # client 连接 policy server 的地址。
  # server 和 client 在同一台机器上时写 127.0.0.1。
  # 如果 server 在另一台机器上，写 server 所在机器的 IP。
  policy_host: 127.0.0.1
  policy_port: 8000

  # 观测来源：
  # bridge（相机线直接插主控板）：从 TRON2 Bridge WebSocket 获取图像和状态。
  # legacy（相机线通过usb连接主机电脑）：直接使用本机 RealSense 相机，机器人状态从机器人 WebSocket 获取。
  observation_source: bridge

  # 发送给模型的状态维度：
  # 16 表示双臂关节和夹爪。
  # 18 表示在 16 维基础上额外包含头部关节。
  state_dim: 16

  # policy 动作执行频率。publish_rate 是后台 ServoJ 指令发送频率。
  fps: 30.0
  publish_rate: 300.0

  # 普通非 RTC client 运行多少个 policy action chunk。
  # 设置为 null 表示不限制步数，需要手动停止。
  max_steps: null

  # 运行 examples/tron2/pi_client_rtc.py 时设置为 true。
  rtc_enabled: false

  # RTC 运行时长，单位秒。设置为 0 表示一直运行直到手动停止。
  duration: 120.0

  # RTC 时序参数。H 会从 server metadata/action_horizon 读取。
  # execution_horizon 是论文里的 s，delay 是初始 d，单位为 action frame。
  execution_horizon: 10
  delay: 2

  # 推理时 RTC guidance。若模型使用 trained_rtc_mode，通常可以将 guidance 关闭。
  rtc_guidance_enabled: true
  rtc_guidance_weight: 10.0
  trained_rtc_mode: false

  # 短暂观测中断时等待新鲜观测，不复用旧 obs。
  obs_timeout_budget_s: 5.0
  obs_recovery_blend_frames: 6

  # 可选的 client 侧动作平滑，用于 queue replacement 后的可执行动作。
  rtc_action_postprocess:
    enabled: false
    boundary_blend_frames: 0
    boundary_blend_curve: smoothstep
    boundary_blend_scope: arm
    ema_alpha: 1.0
    ema_frames: 0
    ema_scope: arm

  log_level: INFO

  # 是否保存执行过程中的 action/state CSV 日志。
  save_record: false
  action_output_path: debug_images/tron2_action_data.csv
  state_output_path: debug_images/tron2_state_data.csv
  rtc_action_output_path: debug_images/tron2_rtc_action_data.csv
  rtc_state_output_path: debug_images/tron2_rtc_state_data.csv

  # 仅 observation_source 为 legacy 时使用。
  # bridge 模式下通常不需要改这个字段。
  legacy_use_time_sync: true

  # client 侧任务指令。
  # null 表示使用 policy.default_prompt。
  # 也可以运行 client 时通过 --prompt 临时覆盖。
  prompt: null

robot:
  # 机器人 WebSocket 控制器地址。
  ip: ROBOT_IP
  port: 5000

  # 机器人初始化双臂关节位置，共 14 个值：左臂 7 个 + 右臂 7 个。
  # 部署前请确认该姿态在你的机器人上安全可达。
  init_joints:
    - 0.026899
    - 0.2612
    - -0.02709991
    - -1.5477003
    - 0.265
    - 0.0180999
    - -0.0614999
    - 0.008999
    - -0.269
    - 0.02069998
    - -1.5567001
    - -0.254
    - -0.02309972
    - 0.06469989

  # 头部初始化位置 [pitch, yaw]。
  # 不需要初始化头部时保持 null。
  init_head: null

  # 机器人状态反馈队列和轮询参数。
  state_queue_maxlen: 7
  polling_rate: 200.0
  connection_timeout: 5.0

#若使用bridge模式，才需要配置下面的内容
#一般使用默认即可
bridge:
  # client.observation_source 为 bridge 时需要配置。
  # 如果 Bridge 使用 TLS，通常格式为 wss://BRIDGE_HOST。
  host: wss://BRIDGE_HOST
  ws_path: /bridge/ws

  # bridge：使用 Bridge 对齐后的机器人状态。
  # legacy：图像仍来自 Bridge，但机器人状态来自机器人 WebSocket。
  state_source: bridge

  # 图像限频。0 表示不额外限频，使用 Bridge 当前输出频率。
  image_max_fps: 0

  # 图像和状态对齐允许的最大时间差，单位毫秒。
  align_max_delay_ms: 200

  # 如果使用自签名证书或内网测试证书，通常保持 false。
  verify_tls: false

  # 调试图像保存开关。打开后会持续刷新 debug_image_dir 下的图片。
  save_debug_images: false
  debug_image_dir: debug_images


#这里需要将HEAD_CAMERA_SERIAL、LEFT_WRIST_CAMERA_SERIAL、RIGHT_WRIST_CAMERA_SERIAL替换为你实际使用的RealSense相机序列号
camera:
  # client.observation_source 为 legacy 时需要配置。
  # 将 RealSense 序列号映射到模型期望的相机名称。
  serial_to_name:
    HEAD_CAMERA_SERIAL: cam_high
    LEFT_WRIST_CAMERA_SERIAL: cam_left_wrist
    RIGHT_WRIST_CAMERA_SERIAL: cam_right_wrist

  # 模型输入使用的相机名称。
  camera_names:
    - cam_high
    - cam_left_wrist
    - cam_right_wrist

  # RealSense 彩色图像分辨率，格式为 [高度, 宽度, 通道数]。
  resolution: [480, 640, 3]
  fps: 30
  max_queue_size: 10

  # legacy 相机调试图像保存开关。
  save_debug_images: false
  debug_image_dir: debug_images
